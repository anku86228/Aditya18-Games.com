<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Highway Legends Pro Max - FULLSCREEN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
html,body{overflow:hidden;background:#111;touch-action:none;width:100%;height:100%;position:fixed;}
.screen{display:none;width:100vw;height:100vh;position:relative;}
.screen.active{display:block;}
#homeScreen{background:linear-gradient(135deg,#1e3c72,#2a5298);color:white;text-align:center;padding-top:15vh;}
#homeScreen h1{font-size:42px;margin-bottom:20px;text-shadow:3px 3px 6px #000;}
.menuBtn{width:220px;padding:16px;margin:12px auto;display:block;background:linear-gradient(orange,#ff6a00);border:none;border-radius:12px;font-size:18px;font-weight:bold;color:white;box-shadow:0 4px 8px rgba(0,0,0,0.3);}
.menuBtn:active{transform:scale(0.95);}
#game{background:#3a3a3a;position:relative;overflow:hidden;width:100vw;height:100vh;}
#game.night{background:#0a0a2a;}
#road{width:100%;height:100%;background:repeating-linear-gradient(0deg,#555 0px,#555 40px,#444 40px,#444 80px);position:absolute;animation:roadMove 0.3s linear infinite;}
@keyframes roadMove{from{background-position:0 0;}to{background-position:0 80px;}}
.lane{position:absolute;top:0;bottom:0;width:6px;background:repeating-linear-gradient(to bottom,white 0px,white 20px,transparent 20px,transparent 40px);}
#lane1{left:33.3%;}#lane2{left:66.6%;}
#player{width:60px;height:110px;position:absolute;bottom:100px;left:50%;transform:translateX(-50%);z-index:50;transition:left 0.15s ease-out;filter:drop-shadow(0 8px 10px rgba(0,0,0,0.6));}
.car-svg{width:100%;height:100%;}
.enemy{width:60px;height:110px;position:absolute;z-index:10;filter:drop-shadow(0 6px 8px rgba(0,0,0,0.5));}
.enemy.truck{width:60px;height:140px;}
.enemy.bus{width:60px;height:160px;}
.coin{width:35px;height:35px;position:absolute;z-index:20;filter:drop-shadow(0 0 8px gold);animation:spin 2s linear infinite;}
@keyframes spin{100%{transform:rotateY(360deg);}}
#hud{position:absolute;top:10px;left:10px;color:white;z-index:100;font-size:15px;line-height:1.6;text-shadow:2px 2px 4px #000;background:rgba(0,0,0,0.4);padding:10px;border-radius:10px;}
#fuelBar{width:160px;height:18px;background:#333;border-radius:10px;margin-top:5px;overflow:hidden;border:2px solid #fff;}
#fuelFill{width:100%;height:100%;background:linear-gradient(90deg,lime,#00ff00);transition:width 0.3s;}
#speedMeter{position:absolute;top:10px;right:80px;color:white;font-size:20px;text-shadow:2px 2px 4px #000;background:rgba(0,0,0,0.4);padding:8px 15px;border-radius:10px;}
.controls{position:absolute;bottom:20px;width:100%;display:flex;justify-content:space-between;padding:0 20px;z-index:100;}
.btn{width:75px;height:75px;background:rgba(255,255,255,0.25);backdrop-filter:blur(5px);border:2px solid rgba(255,255,255,0.5);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;color:white;user-select:none;box-shadow:0 4px 10px rgba(0,0,0,0.3);}
.btn:active{background:rgba(255,255,255,0.5);transform:scale(0.9);}
#nitroBtn{position:absolute;right:20px;bottom:120px;width:85px;height:85px;background:linear-gradient(135deg,#ff6a00,#ff0000);border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;z-index:100;box-shadow:0 0 20px rgba(255,100,0,0.6);}
#nitroBtn.active{animation:pulse 0.5s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 20px rgba(255,100,0,0.6);}50%{box-shadow:0 0 35px rgba(255,100,0,1);}}
#pauseBtn{position:absolute;top:10px;right:10px;width:55px;height:55px;background:white;border-radius:8px;display:flex;align-items:center;justify-content:center;z-index:100;font-size:24px;}
#hornBtn{position:absolute;right:20px;bottom:220px;width:65px;height:65px;background:linear-gradient(135deg,#4169E1,#0000CD);border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;z-index:100;}
#fullscreenBtn{position:absolute;top:10px;right:145px;width:55px;height:55px;background:white;border-radius:8px;display:flex;align-items:center;justify-content:center;z-index:100;font-size:24px;}
#garageScreen,#shopScreen{background:#1a1a1a;color:white;padding:20px;overflow-y:auto;}
.garageTitle{text-align:center;font-size:32px;margin-bottom:20px;}
.vehicleGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-bottom:30px;}
.vehicleCard{background:linear-gradient(135deg,#333,#222);padding:12px;border-radius:12px;text-align:center;border:2px solid #444;}
.vehicleCard.locked{opacity:0.4;filter:grayscale(1);}
.carPreview{width:100%;height:90px;border-radius:8px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;}
.buyBtn{background:linear-gradient(135deg,#00ff00,#00cc00);border:none;padding:10px;border-radius:8px;margin-top:8px;width:100%;color:#000;font-weight:bold;}
.selectBtn{background:linear-gradient(135deg,#1E90FF,#0066CC);border:none;padding:10px;border-radius:8px;margin-top:8px;width:100%;color:white;font-weight:bold;}
.backBtn{position:absolute;top:15px;left:15px;padding:12px 24px;background:linear-gradient(135deg,#ff0000,#cc0000);border:none;border-radius:8px;color:white;font-weight:bold;z-index:10;}
#gameOver{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,rgba(0,0,0,0.95),rgba(20,20,20,0.95));color:white;padding:40px;border-radius:15px;text-align:center;display:none;z-index:200;border:3px solid orange;}
</style>
</head>
<body>

<div id="homeScreen" class="screen active">
    <h1>🏁 HIGHWAY LEGENDS PRO</h1>
    <button class="menuBtn" onclick="startGame()">▶ PLAY GAME</button>
    <button class="menuBtn" onclick="showScreen('garageScreen')">🏎 GARAGE</button>
    <button class="menuBtn" onclick="showScreen('shopScreen')">🛒 SHOP</button>
    <p style="margin-top:30px;font-size:18px;">High Score: <span id="homeHighScore">0</span></p>
    <p style="font-size:18px;">Total Coins: <span id="homeCoins">0</span> 🪙</p>
</div>

<div id="game" class="screen">
    <div id="road"><div class="lane" id="lane1"></div><div class="lane" id="lane2"></div></div>
    <div id="player"></div>
    <div id="hud">
        <div>🏆 Score: <span id="score">0</span></div>
        <div>🪙 Coins: <span id="coins">0</span></div>
        <div>📏 Distance: <span id="distance">0</span>m</div>
        <div>🎚 Level: <span id="level">1</span></div>
        <div>⛽ Fuel</div>
        <div id="fuelBar"><div id="fuelFill"></div></div>
    </div>
    <div id="speedMeter">0 km/h</div>
    <div id="fullscreenBtn" onclick="toggleFullscreen()">⛶</div>
    <div id="pauseBtn">⏸️</div>
    <div id="hornBtn">📢</div>
    <div id="nitroBtn">NITRO</div>
    <div class="controls"><div class="btn" id="leftBtn">←</div><div class="btn" id="rightBtn">→</div></div>
    <div id="gameOver">
        <h2>💀 GAME OVER!</h2>
        <p style="font-size:20px;margin:10px 0;">Score: <span id="finalScore">0</span></p>
        <p style="font-size:18px;margin:10px 0;">Coins: <span id="coinsEarned">0</span> 🪙</p>
        <p style="font-size:16px;margin:10px 0;">High Score: <span id="finalHighScore">0</span></p>
        <button onclick="showScreen('homeScreen')" style="background:linear-gradient(135deg,orange,#ff6a00);color:white;margin:5px;padding:12px 25px;border:none;border-radius:8px;">🏠 HOME</button>
        <button onclick="restartGame()" style="background:linear-gradient(135deg,lime,#00ff00);color:#000;margin:5px;padding:12px 25px;border:none;border-radius:8px;">🔄 RESTART</button>
    </div>
</div>

<div id="garageScreen" class="screen">
    <button class="backBtn" onclick="showScreen('homeScreen')">← BACK</button>
    <h2 class="garageTitle">🏎 MY GARAGE</h2>
    <h3 style="color:orange;margin:10px 0;">Luxury Cars - 12 Models</h3>
    <div class="vehicleGrid" id="carsGrid"></div>
    <h3 style="color:dodgerblue;margin:20px 0 10px 0;">Super Bikes - 12 Models</h3>
    <div class="vehicleGrid" id="bikesGrid"></div>
</div>

<div id="shopScreen" class="screen">
    <button class="backBtn" onclick="showScreen('homeScreen')">← BACK</button>
    <h2 class="garageTitle">🛒 VEHICLE SHOP</h2>
    <p style="text-align:center;font-size:20px;margin-bottom:20px;">Your Coins: <span id="shopCoins">0</span> 🪙</p>
    <div class="vehicleGrid" id="shopGrid"></div>
</div>

<script>
function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
            alert(`Error: ${err.message}`);
        });
    } else {
        document.exitFullscreen();
    }
}
document.addEventListener('fullscreenchange', () => {
    document.getElementById('fullscreenBtn').textContent = document.fullscreenElement? '⊡' : '⛶';
});
const CAR_SVG = {
    player: `<svg class="car-svg" viewBox="0 0 60 110"><defs><linearGradient id="pb" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#ff3333"/><stop offset="100%" style="stop-color:#cc0000"/></linearGradient></defs><path d="M10 20 L50 20 L55 35 L55 90 L50 105 L10 105 L5 90 L5 35 Z" fill="url(#pb)" stroke="#800000"/><path d="M15 25 L45 25 L42 40 L18 40 Z" fill="#87CEEB" opacity="0.7" stroke="#333"/><path d="M18 70 L42 70 L40 85 L20 85 Z" fill="#87CEEB" opacity="0.7" stroke="#333"/><ellipse cx="15" cy="95" rx="6" ry="4" fill="#ffff00" opacity="0.9"/><ellipse cx="45" cy="95" rx="6" ry="4" fill="#ffff00" opacity="0.9"/><ellipse cx="15" cy="15" rx="4" ry="3" fill="#ff0000"/><ellipse cx="45" cy="15" rx="4" ry="3" fill="#ff0000"/><rect x="2" y="30" width="6" height="15" rx="2" fill="#1a1a1a"/><rect x="52" y="30" width="6" height="15" rx="2" fill="#1a1a1a"/><rect x="2" y="75" width="6" height="15" rx="2" fill="#1a1a1a"/><rect x="52" y="75" width="6" height="15" rx="2" fill="#1a1a1a"/></svg>`,
    sedan: `<svg class="car-svg" viewBox="0 0 60 110"><path d="M12 25 L48 25 L53 40 L53 85 L48 100 L12 100 L7 85 L7 40 Z" fill="#1E90FF" stroke="#0066CC"/><path d="M17 30 L43 30 L41 45 L19 45 Z" fill="#87CEEB" opacity="0.7"/><path d="M19 65 L41 65 L39 80 L21 80 Z" fill="#87CEEB" opacity="0.7"/><ellipse cx="17" cy="92" rx="5" ry="3" fill="#ffff00" opacity="0.8"/><ellipse cx="43" cy="92" rx="5" ry="3" fill="#ffff00" opacity="0.8"/><rect x="4" y="35" width="5" height="12" rx="1" fill="#1a1a1a"/><rect x="51" y="35" width="5" height="12" rx="1" fill="#1a1a1a"/><rect x="4" y="70" width="5" height="12" rx="1" fill="#1a1a1a"/><rect x="51" y="70" width="5" height="12" rx="1" fill="#1a1a1a"/></svg>`,
    suv: `<svg class="car-svg" viewBox="0 0 60 110"><path d="M10 20 L50 20 L55 30 L55 95 L50 105 L10 105 L5 95 L5 30 Z" fill="#32CD32" stroke="#228B22"/><path d="M15 25 L45 25 L43 40 L17 40 Z" fill="#87CEEB" opacity="0.7"/><path d="M17 60 L43 60 L41 75 L19 75 Z" fill="#87CEEB" opacity="0.7"/><ellipse cx="15" cy="95" rx="6" ry="4" fill="#ffff00" opacity="0.9"/><ellipse cx="45" cy="95" rx="6" ry="4" fill="#ffff00" opacity="0.9"/><rect x="2" y="30" width="6" height="18" rx="2" fill="#1a1a1a"/><rect x="52" y="30" width="6" height="18" rx="2" fill="#1a1a1a"/><rect x="2" y="75" width="6" height="18" rx="2" fill="#1a1a1a"/><rect x="52" y="75" width="6" height="18" rx="2" fill="#1a1a1a"/></svg>`,
    truck: `<svg class="car-svg" viewBox="0 0 60 140"><rect x="8" y="10" width="44" height="35" rx="3" fill="#8B4513" stroke="#654321"/><rect x="10" y="15" width="40" height="20" rx="2" fill="#87CEEB" opacity="0.7"/><rect x="5" y="50" width="50" height="80" rx="3" fill="#A0522D" stroke="#654321"/><rect x="2" y="55" width="6" height="15" rx="2" fill="#1a1a1a"/><rect x="52" y="55" width="6" height="15" rx="2" fill="#1a1a1a"/><rect x="2" y="100" width="6" height="15" rx="2" fill="#1a1a1a"/><rect x="52" y="100" width="6" height="15" rx="2" fill="#1a1a1a"/></svg>`,
    bus: `<svg class="car-svg" viewBox="0 0 60 160"><rect x="5" y="5" width="50" height="150" rx="5" fill="#0000CD" stroke="#00008B"/><rect x="10" y="10" width="40" height="15" rx="2" fill="#87CEEB" opacity="0.7"/><rect x="10" y="30" width="40" height="15" rx="2" fill="#87CEEB" opacity="0.7"/><rect x="10" y="50" width="40" height="15" rx="2" fill="#87CEEB" opacity="0.7"/><rect x="10" y="70" width="40" height="15" rx="2" fill="#87CEEB" opacity="0.7"/><rect x="2" y="20" width="6" height="18" rx="2" fill="#1a1a1a"/><rect x="52" y="20" width="6" height="18" rx="2" fill="#1a1a1a"/><rect x="2" y="120" width="6" height="18" rx="2" fill="#1a1a1a"/><rect x="52" y="120" width="6" height="18" rx="2" fill="#1a1a1a"/></svg>`
};
const VEHICLES = {
    cars: [
        {name:"Rolls-Royce",price:0,color:"#000080",unlocked:true},
        {name:"Range Rover",price:500,color:"#228B22",unlocked:false},
        {name:"Lamborghini",price:1000,color:"#FFD700",unlocked:false},
        {name:"Bugatti",price:2000,color:"#0000FF",unlocked:false},
        {name:"Ferrari",price:1500,color:"#FF0000",unlocked:false},
        {name:"McLaren",price:2500,color:"#FF8C00",unlocked:false},
        {name:"Porsche",price:1800,color:"#C0C0C0",unlocked:false},
        {name:"BMW M Series",price:1200,color:"#4169E1",unlocked:false},
        {name:"Mercedes AMG",price:1600,color:"#A9A9A9",unlocked:false},
        {name:"Audi R8",price:1400,color:"#FFFFFF",unlocked:false},
        {name:"Nissan GTR",price:2200,color:"#DC143C",unlocked:false},
        {name:"Dodge Challenger",price:1100,color:"#000000",unlocked:false}
    ],
    bikes: [
        {name:"Kawasaki Ninja",price:0,color:"#00FF00",unlocked:true},
        {name:"Hayabusa",price:600,color:"#8B0000",unlocked:false},
        {name:"Ducati Panigale",price:1100,color:"#FF0000",unlocked:false},
        {name:"BMW S1000RR",price:1300,color:"#0000FF",unlocked:false},
        {name:"Yamaha R1",price:1000,color:"#1E90FF",unlocked:false},
        {name:"KTM RC 390",price:700,color:"#FF8C00",unlocked:false},
        {name:"Aprilia RSV4",price:1400,color:"#000000",unlocked:false},
        {name:"Honda CBR",price:900,color:"#FF0000",unlocked:false},
        {name:"Suzuki GSX-R",price:950,color:"#0000CD",unlocked:false},
        {name:"Ninja H2",price:2000,color:"#2F4F4F",unlocked:false},
        {name:"Ducati V4",price:1800,color:"#DC143C",unlocked:false},
        {name:"MV Agusta",price:1600,color:"#FFD700",unlocked:false}
    ]
};
let gameData = JSON.parse(localStorage.getItem('hlpGameData')) || {
    totalCoins: 1000, highScore: 0, selectedVehicle: {type:'cars',index:0},
    unlockedVehicles: ['cars-0','bikes-0']
};
function saveGame() {
    localStorage.setItem('hlpGameData', JSON.stringify(gameData));
    updateHomeUI();
}
let player, game, scoreEl, coinsEl, distanceEl, levelEl, fuelFill, speedMeter;
let playerPos = 1, score = 0, coins = 0, distance = 0, level = 1;
let fuel = 100, gameSpeed = 5, baseSpeed = 5, gameRunning = false;
let enemies = [], gameCoins = [], paused = false, nitroActive = false;
let isDay = true, dayNightTimer = 0, lastSpawnTime = 0;
let enemyTypes = ['sedan','suv','truck','bus'];
function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
    if(screenId === 'garageScreen') loadGarage();
    if(screenId === 'shopScreen') loadShop();
    if(screenId === 'homeScreen') updateHomeUI();
}
function updateHomeUI() {
    document.getElementById('homeHighScore').textContent = gameData.highScore;
    document.getElementById('homeCoins').textContent = gameData.totalCoins;
    document.getElementById('shopCoins').textContent = gameData.totalCoins;
}
function loadGarage() {
    const carsGrid = document.getElementById('carsGrid');
    const bikesGrid = document.getElementById('bikesGrid');
    carsGrid.innerHTML = ''; bikesGrid.innerHTML = '';
    VEHICLES.cars.forEach((car, i) => {
        let isUnlocked = gameData.unlockedVehicles.includes(`cars-${i}`);
        let isSelected = gameData.selectedVehicle.type==='cars' && gameData.selectedVehicle.index===i;
        carsGrid.innerHTML += `
            <div class="vehicleCard ${!isUnlocked?'locked':''}">
                <div class="carPreview" style="background:${car.color};display:flex;align-items:center;justify-content:center;">
                    <svg width="80" height="60" viewBox="0 0 60 60"><rect x="10" y="20" width="40" height="25" rx="5" fill="white" opacity="0.9"/><rect x="15" y="25" width="30" height="15" rx="3" fill="#87CEEB"/></svg>
                </div>
                <p style="font-weight:bold;">${car.name}</p>
                ${isUnlocked? `<button class="selectBtn" onclick="selectVehicle('cars',${i})">${isSelected?'✓ SELECTED':'SELECT'}</button>` : `<p>🔒 ${car.price} 🪙</p>`}
            </div>
        `;
    });
    VEHICLES.bikes.forEach((bike, i) => {
        let isUnlocked = gameData.unlockedVehicles.includes(`bikes-${i}`);
        let isSelected = gameData.selectedVehicle.type==='bikes' && gameData.selectedVehicle.index===i;
        bikesGrid.innerHTML += `
            <div class="vehicleCard ${!isUnlocked?'locked':''}">
                <div class="carPreview" style="background:${bike.color};display:flex;align-items:center;justify-content:center;">
                    <svg width="80" height="60" viewBox="0 0 60 60"><ellipse cx="30" cy="30" rx="15" ry="20" fill="white" opacity="0.9"/><circle cx="30" cy="30" r="10" fill="#333"/></svg>
                </div>
                <p style="font-weight:bold;">${bike.name}</p>
                ${isUnlocked? `<button class="selectBtn" onclick="selectVehicle('bikes',${i})">${isSelected?'✓ SELECTED':'SELECT'}</button>` : `<p>🔒 ${bike.price} 🪙</p>`}
            </div>
        `;
    });
}
function loadShop() {
    const shopGrid = document.getElementById('shopGrid');
    shopGrid.innerHTML = '';
    [...VEHICLES.cars.map((v,i)=>({...v,type:'cars',idx:i})),...VEHICLES.bikes.map((v,i)=>({...v,type:'bikes',idx:i}))].forEach(v => {
        let id = `${v.type}-${v.idx}`;
        if(gameData.unlockedVehicles.includes(id)) return;
        shopGrid.innerHTML += `
            <div class="vehicleCard">
                <div class="carPreview" style="background:${v.color};"></div>
                <p style="font-weight:bold;">${v.name}</p>
                <p style="color:gold;">${v.price} 🪙</p>
                <button class="buyBtn" onclick="buyVehicle('${v.type}',${v.idx},${v.price})">BUY NOW</button>
            </div>
        `;
    });
}
function buyVehicle(type, index, price) {
    if(gameData.totalCoins >= price) {
        gameData.totalCoins -= price;
        gameData.unlockedVehicles.push(`${type}-${index}`);
        saveGame(); loadShop();
        alert('🎉 Vehicle Unlocked!');
    } else {
        alert('❌ Not enough coins!');
    }
}
function selectVehicle(type, index) {
    gameData.selectedVehicle = {type, index};
    saveGame(); loadGarage();
}
function startGame() {
    showScreen('game');
    if(document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(()=>{});
    }
    initGame();
}
function initGame() {
    player = document.getElementById('player');
    game = document.getElementById('game');
    scoreEl = document.getElementById('score');
    coinsEl = document.getElementById('coins');
    distanceEl = document.getElementById('distance');
    levelEl = document.getElementById('level');
    fuelFill = document.getElementById('fuelFill');
    speedMeter = document.getElementById('speedMeter');
    let v = VEHICLES[gameData.selectedVehicle.type][gameData.selectedVehicle.index];
    player.innerHTML = CAR_SVG.player.replace(/#ff3333/g, v.color).replace(/#cc0000/g, v.color);
    playerPos = 1; score = 0; coins = 0; distance = 0; level = 1;
    fuel = 100; gameSpeed = baseSpeed = 5; gameRunning = true;
    enemies = []; gameCoins = []; paused = false; nitroActive = false;
    isDay = true; dayNightTimer = 0; lastSpawnTime = 0;
    document.getElementById('gameOver').style.display = 'none';
    game.classList.remove('night');
    document.querySelectorAll('.enemy,.coin').forEach(e=>e.remove());
    setupControls(); updateGame();
}
function setupControls() {
    document.getElementById('leftBtn').ontouchstart = (e) => {e.preventDefault(); movePlayer('left');};
    document.getElementById('rightBtn').ontouchstart = (e) => {e.preventDefault(); movePlayer('right');};
    document.getElementById('pauseBtn').onclick = togglePause;
    document.getElementById('nitroBtn').onclick = activateNitro;
    document.getElementById('hornBtn').onclick = () => console.log('HORN!');
    document.onkeydown = (e) => {
        if(e.key === 'ArrowLeft') movePlayer('left');
        if(e.key === 'ArrowRight') movePlayer('right');
        if(e.key === ' ') activateNitro();
        if(e.key === 'p' || e.key === 'P') togglePause();
    };
}
function movePlayer(dir) {
    if(!gameRunning || paused) return;
    if(dir === 'left' && playerPos > 0) playerPos--;
    if(dir === 'right' && playerPos < 2) playerPos++;
    player.style.left = (16.65 + playerPos * 33.3) + '%';
}
function togglePause() {
    paused =!paused;
    document.getElementById("pauseBtn").innerText = paused? "▶" : "⏸";
    if(!paused) updateGame();
}
function activateNitro() {
    if(nitroActive || paused || fuel < 20 ||!gameRunning) return;
    nitroActive = true; gameSpeed += 5;
    document.getElementById("nitroBtn").innerText = "BOOST!";

}
