<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>GTA Lite V5</title>
<style>
*{margin:0;padding:0;overflow:hidden;box-sizing:border-box}
body{background:#87CEEB}
canvas{display:block}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;font-family:Arial;font-weight:bold;pointer-events:none;z-index:10}
#money{position:absolute;top:10px;left:10px;color:#0f0;font-size:20px;text-shadow:2px 2px #000}
#speed{position:absolute;top:45px;right:10px;color:#0f0;background:#000;padding:8px 15px;border:2px solid #0f0;border-radius:10px;font-size:16px}
#controls{position:absolute;bottom:15px;width:100%;display:flex;justify-content:space-between;padding:0 15px;pointer-events:auto}
.btn{width:65px;height:65px;background:rgba(255,255,255,.8);border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#000;user-select:none}
#RB{display:flex;flex-direction:column;gap:10px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="money">$2,000,000</div>
  <div id="speed">0 KM/H</div>
  <div id="controls">
    <div><div class="btn" id="L">←</div><div class="btn" id="R">→</div></div>
    <div id="RB"><div class="btn" id="U" style="background:#0f0">↑</div><div class="btn" id="D" style="background:red">↓</div><div class="btn" id="E" style="background:blue;color:#fff;font-size:11px">ENTER</div></div>
  </div>
</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import*as T from'three';

// 1. Scene + Camera + Renderer PAKKA
const s=new T.Scene();s.background=new T.Color(0x87CEEB);
const cam=new T.PerspectiveCamera(70,innerWidth/innerHeight,.1,1000);cam.position.set(0,18,28);
const r=new T.WebGLRenderer({canvas:document.getElementById('c'),antialias:1});r.setSize(innerWidth,innerHeight);
window.onresize=()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();r.setSize(innerWidth,innerHeight)};

// 2. Light PAKKA - Andhera nahi hoga
s.add(new T.AmbientLight(0xffffff,1.8));

// 3. Zameen + Sadak PAKKA DIKHEGA AB
const gr=new T.Mesh(new T.PlaneGeometry(500,500),new T.MeshLambertMaterial({color:0x666}));gr.rotation.x=-Math.PI/2;s.add(gr);
for(let i=-200;i<200;i+=60){const rd=new T.Mesh(new T.PlaneGeometry(500,10),new T.MeshLambertMaterial({color:0x222}));rd.rotation.x=-Math.PI/2;rd.position.set(0,.1,i);s.add(rd);}

// 4. Player - Peela Gola
const pl=new T.Mesh(new T.SphereGeometry(1.5,16,16),new T.MeshLambertMaterial({color:0xffaa00}));pl.position.set(0,1.5,0);s.add(pl);

// 5. 1 Car PAKKA - Tere saamne
const car=new T.Mesh(new T.BoxGeometry(4,2,6),new T.MeshPhongMaterial({color:0x0066ff}));car.position.set(0,1,-12);car.ud={t:0,sp:0};s.add(car);

// 6. Control Logic
let sp=6,ag=0,K={},inV=0,cV=0;
['L','R','U','D'].forEach(k=>{const b=document.getElementById(k);b.ontouchstart=e=>{e.preventDefault();K[k]=1};b.ontouchend=e=>{e.preventDefault();K[k]=0}});
document.getElementById('E').ontouchstart=e=>{e.preventDefault();if(!inV){if(car.position.distanceTo(pl.position)<12){inV=1;cV=car;car.ud.t=1;pl.visible=0;document.getElementById('E').innerText='EXIT';}}else{inV=0;car.ud.t=0;pl.position.copy(car.position);pl.position.z+=10;pl.visible=1;cV=0;document.getElementById('E').innerText='ENTER';}};

// 7. Game Loop
function U(){
  const t=inV?cV:pl;const mx=inV?25:8;
  if(K.U)sp=Math.min(sp+.8,mx);else if(K.D)sp=Math.max(sp-1,6);else sp=Math.max(sp*.95,6);
  if(K.L)ag-=.1;if(K.R)ag+=.1;
  t.position.x+=Math.sin(ag)*sp*0.1;t.position.z-=Math.cos(ag)*sp*0.1;t.rotation.y=ag;
  if(inV)pl.position.copy(t.position);
  cam.position.x=t.position.x;cam.position.z=t.position.z+28;cam.lookAt(t.position);
  document.getElementById('speed').innerText=Math.floor(sp*20)+' KM/H'
}
function A(){requestAnimationFrame(A);U();r.render(s,cam)}A();
</script>
</body>
           </html>
