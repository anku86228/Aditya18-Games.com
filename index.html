<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Bike Racer V4 Fixed</title>
<style>
*{margin:0;padding:0;overflow:hidden;font-family:'Arial Black',Arial}
canvas{display:block;background:linear-gradient(#87CEEB, #1E90FF)}
#ui{position:absolute;top:0;left:0;width:100%;color:#fff;text-shadow:3px 3px #000;pointer-events:none}
#score{position:absolute;top:15px;left:15px;font-size:26px;background:rgba(0,0,0,.5);padding:5px 15px;border-radius:10px}
#speed{position:absolute;top:15px;right:15px;font-size:26px;color:#0f0;background:rgba(0,0,0,.5);padding:5px 15px;border-radius:10px}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:48px;display:none;background:rgba(255,0,0,.9);padding:20px;border-radius:20px;border:3px solid #fff}
#gas{position:absolute;bottom:30px;right:30px;width:120px;height:120px;background:radial-gradient(circle, #0f0 0%, #0a0 100%);border-radius:50%;pointer-events:auto;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:24px;border:4px solid #fff;box-shadow:0 0 25px #0f0}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui"><div id="score">Score: 0</div><div id="speed">0 KM/H</div><div id="msg">CRASH! Tap to Restart</div></div>
<div id="gas">GAS</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
const T=THREE;
const s=new T.Scene();
const cam=new T.PerspectiveCamera(60,innerWidth/innerHeight,0.1,500); // FOV kam kiya
const r=new T.WebGLRenderer({canvas:document.getElementById('c'),antialias:true});r.setSize(innerWidth,innerHeight);
s.add(new T.AmbientLight(0xffffff,1.5));const dl=new T.DirectionalLight(0xffffff,1);dl.position.set(5,10,7);s.add(dl);

// Infinite Road
const road=new T.Mesh(new T.PlaneGeometry(30,200),new T.MeshLambertMaterial({color:0x555}));road.rotation.x=-Math.PI/2;s.add(road);
const lines=[];for(let i=-100;i<100;i+=15){const line=new T.Mesh(new T.BoxGeometry(2,0.1,8),new T.MeshLambertMaterial({color:0xffff00}));line.position.set(0,0.1,i);s.add(line);lines.push(line);}

// Bike - Badi wali
const bike=new T.Group();
const body=new T.Mesh(new T.BoxGeometry(1.5,1,3),new T.MeshPhongMaterial({color:0xff0000}));body.position.y=0.5;bike.add(body);
const w1=new T.Mesh(new T.TorusGeometry(0.7,0.2,16,16),new T.MeshPhongMaterial({color:0x222}));w1.rotation.x=Math.PI/2;w1.position.set(0,0,-1.2);bike.add(w1);
const w2=new T.Mesh(new T.TorusGeometry(0.7,0.2,16,16),new T.MeshPhongMaterial({color:0x222}));w2.rotation.x=Math.PI/2;w2.position.set(0,0,1.2);bike.add(w2);
bike.position.set(0,1.5,0);s.add(bike);

// Ram
const ram=[];function addRam(){const r=new T.Mesh(new T.IcosahedronGeometry(1.5),new T.MeshLambertMaterial({color:0x8B4513}));r.position.set(Math.random()*20-10,1.5,-Math.random()*200-30);s.add(r);ram.push(r)}
for(let i=0;i<20;i++)addRam();

// Game Logic
let x=0,sp=0,score=0,alive=1;
document.getElementById('gas').ontouchstart=e=>{e.preventDefault();sp=0.5};
document.getElementById('gas').ontouchend=e=>{e.preventDefault();sp=0};
window.ondeviceorientation=e=>{if(alive)x=e.gamma/35};
document.getElementById('msg').ontouchstart=()=>{alive=1;score=0;bike.position.set(0,1.5,0);document.getElementById('msg').style.display='none';ram.forEach(r=>r.position.z=-Math.random()*200-30)};

// Loop
function A(){
  requestAnimationFrame(A);if(!alive){r.render(s,cam);return;}

  bike.position.x+=x;bike.position.x=Math.max(-14,Math.min(14,bike.position.x));bike.rotation.z=-x*0.4;bike.children[1].rotation.z+=sp*0.5;bike.children[2].rotation.z+=sp*0.5; // Pahiye ghumenge

  // CAMERA FIX: Camera hamesha Bike ke peeche chipka rahega
  cam.position.set(bike.position.x, bike.position.y + 6, bike.position.z + 12);
  cam.lookAt(bike.position.x, bike.position.y, bike.position.z - 5);

  road.position.z = bike.position.z - 100;
  lines.forEach(l=>{l.position.z = bike.position.z + (l.position.z - bike.position.z) % 200; if(l.position.z - bike.position.z > 100) l.position.z -= 200;});

  ram.forEach(r=>{
    r.position.z+=sp*15;r.rotation.x+=0.03;r.rotation.y+=0.03;
    if(r.position.z > bike.position.z + 40){r.position.z = bike.position.z - Math.random()*200-30;r.position.x=Math.random()*20-10;score+=10}
    if(bike.position.distanceTo(r)<2.5){alive=0;document.getElementById('msg').style.display='block'}
  });
  document.getElementById('score').innerText='Score: '+score;
  document.getElementById('speed').innerText=Math.floor(sp*150)+' KM/H';
  r.render(s,cam);
}
A();
</script>
</body>
</html>
