<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>GTA Mini - Guns & Horses</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
html,body{overflow:hidden;background:#000;touch-action:none;width:100vw;height:100vh;position:fixed;top:0;left:0;}
#gameCanvas{background:#2a4d3a;width:100vw;height:100vh;display:block;}
#hud{position:absolute;top:10px;left:10px;color:white;z-index:100;font-size:14px;text-shadow:2px 2px 4px #000;background:rgba(0,0,0,0.7);padding:12px;border-radius:10px;border:2px solid gold;}
#money{color:#00ff00;font-size:20px;font-weight:bold;}
#wanted{color:#ff0000;font-size:22px;margin-top:5px;}
#health{width:200px;height:20px;background:#333;border:2px solid #fff;margin-top:5px;border-radius:10px;overflow:hidden;}
#healthBar{width:100%;height:100%;background:linear-gradient(90deg,#00ff00,#00cc00);transition:width 0.3s;}
#ammo{color:#ffff00;font-size:16px;margin-top:5px;}
#vehicleInfo{color:#00ffff;margin-top:8px;font-weight:bold;font-size:16px;}
#speedMeter{position:absolute;top:10px;right:170px;color:white;font-size:24px;text-shadow:2px 2px 4px #000;background:rgba(0,0,0,0.7);padding:10px 20px;border-radius:10px;border:2px solid orange;}
#fullscreenBtn{position:absolute;top:10px;right:10px;width:55px;height:55px;background:white;border-radius:8px;display:flex;align-items:center;justify-content:center;z-index:100;font-size:24px;cursor:pointer;border:2px solid #333;}
.controls{position:absolute;bottom:20px;width:100%;display:flex;justify-content:space-between;padding:0 20px;z-index:100;}
.btn{width:75px;height:75px;background:rgba(255,255,255,0.25);backdrop-filter:blur(5px);border:3px solid rgba(255,255,255,0.5);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;color:white;user-select:none;box-shadow:0 4px 15px rgba(0,0,0,0.5);}
.btn:active{background:rgba(255,255,255,0.5);transform:scale(0.9);}
#actionBtn{position:absolute;right:20px;bottom:120px;width:90px;height:90px;background:linear-gradient(135deg,#ff0000,#cc0000);border:4px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;z-index:100;font-size:14px;box-shadow:0 0 20px rgba(255,0,0,0.6);}
#shootBtn{position:absolute;right:20px;bottom:220px;width:90px;height:90px;background:linear-gradient(135deg,#ff6600,#cc3300);border:4px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;z-index:100;font-size:28px;box-shadow:0 0 20px rgba(255,100,0,0.6);}
#miniMap{position:absolute;top:10px;right:10px;width:150px;height:150px;background:rgba(0,0,0,0.8);border:3px solid gold;border-radius:10px;}
.bullet{position:absolute;width:8px;height:8px;background:yellow;border-radius:50%;box-shadow:0 0 10px orange;z-index:50;}
</style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="hud">
    <div id="money">$50,000</div>
    <div>Health:</div>
    <div id="health"><div id="healthBar"></div></div>
    <div id="ammo">🔫 Ammo: 30</div>
    <div id="wanted"></div>
    <div id="vehicleInfo">🚶 Walking</div>
</div>

<div id="speedMeter">0 km/h</div>
<div id="fullscreenBtn" onclick="toggleFullscreen()">⛶</div>
<canvas id="miniMap"></canvas>

<div class="controls">
    <div class="btn" id="leftBtn">←</div>
    <div class="btn" id="rightBtn">→</div>
</div>
<div id="shootBtn">🔫</div>
<div id="actionBtn">ENTER</div>

<script>
function toggleFullscreen() {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => console.log(err));
    } else {
        document.exitFullscreen();
    }
}
document.addEventListener('fullscreenchange', () => {
    document.getElementById('fullscreenBtn').textContent = document.fullscreenElement ? '⊡' : '⛶';
    resizeCanvas();
});

window.addEventListener('load', () => {
    setTimeout(() => {
        if(document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(()=>{});
        }
    }, 500);
});

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
resizeCanvas();

let player = {
    x: canvas.width/2, y: canvas.height/2, width: 30, height: 30,
    angle: 0, speed: 0, maxSpeed: 5,
    inVehicle: false, vehicleType: null,
    health: 100, money: 50000, wantedLevel: 0,
    ammo: 30, hasGun: true
};

// LUXURY CARS
let cars = [
    {name:'Bugatti Chiron', x: 150, y: 200, w: 45, h: 80, color: '#0066FF', taken: false, type: 'car', speed: 12},
    {name:'Lamborghini', x: 350, y: 150, w: 45, h: 75, color: '#FFD700', taken: false, type: 'car', speed: 11},
    {name:'Rolls-Royce', x: 600, y: 400, w: 50, h: 85, color: '#000080', taken: false, type: 'car', speed: 9},
    {name:'Ferrari', x: 100, y: 500, w: 45, h: 75, color: '#FF0000', taken: false, type: 'car', speed: 10}
];

// SUPER BIKES
let bikes = [
    {name:'Ninja H2', x: 250, y: 350, w: 25, h: 55, color: '#00FF00', taken: false, type: 'bike', speed: 15},
    {name:'Hayabusa', x: 450, y: 250, w: 25, h: 55, color: '#8B0000', taken: false, type: 'bike', speed: 14},
    {name:'Ducati Panigale', x: 550, y: 500, w: 25, h: 55, color: '#FF0000', taken: false, type: 'bike', speed: 13}
];

// HORSES 🐴
let horses = [
    {name:'Arabian Horse', x: 300, y: 450, w: 35, h: 60, color: '#8B4513', taken: false, type: 'horse', speed: 8},
    {name:'Mustang', x: 650, y: 300, w: 35, h: 60, color: '#000000', taken: false, type: 'horse', speed: 9},
    {name:'White Stallion', x: 200, y: 600, w: 35, h: 60, color: '#FFFFFF', taken: false, type: 'horse', speed: 7}
];

let buildings = [
    {x: 50, y: 50, w: 100, h: 150},
    {x: 300, y: 100, w: 120, h: 200},
    {x: 500, y: 50, w: 150, h: 180},
    {x: 200, y: 400, w: 100, h: 120}
];

let bullets = [];
let keys = {};
document.addEventListener('keydown', e => {
    keys[e.key] = true;
    if(e.key === ' ') shoot();
});
document.addEventListener('keyup', e => keys[e.key] = false);

document.getElementById('leftBtn').ontouchstart = (e) => {e.preventDefault(); keys['ArrowLeft'] = true;};
document.getElementById('leftBtn').ontouchend = () => keys['ArrowLeft'] = false;
document.getElementById('rightBtn').ontouchstart = (e) => {e.preventDefault(); keys['ArrowRight'] = true;};
document.getElementById('rightBtn').ontouchend = () => keys['ArrowRight'] = false;
document.getElementById('actionBtn').onclick = enterExitVehicle;
document.getElementById('shootBtn').onclick = shoot;

function enterExitVehicle() {
    if(!player.inVehicle) {
        let allVehicles = [...cars, ...bikes, ...horses];
        for(let v of allVehicles) {
            let dist = Math.hypot(player.x - v.x, player.y - v.y);
            if(dist < 70 && !v.taken) {
                player.inVehicle = true;
                player.vehicleType = v.type;
                v.taken = true;
                player.vehicle = v;
                player.maxSpeed = v.speed;
                document.getElementById('actionBtn').textContent = 'EXIT';
                let icon = v.type === 'car' ? '🏎️' : v.type === 'bike' ? '🏍️' : '🐴';
                document.getElementById('vehicleInfo').textContent = icon + ' ' + v.name;
                break;
            }
        }
    } else {
        player.inVehicle = false;
        player.vehicle.taken = false;
        player.x = player.vehicle.x + 70;
        player.y = player.vehicle.y;
        player.vehicleType = null;
        document.getElementById('actionBtn').textContent = 'ENTER';
        document.getElementById('vehicleInfo').textContent = '🚶 Walking';
    }
}

function shoot() {
    if(!player.hasGun || player.ammo <= 0) return;
    player.ammo--;
    let bullet = {
        x: player.x,
        y: player.y,
        angle: player.angle,
        speed: 15,
        life: 60
    };
    bullets.push(bullet);
}

function update() {
    if(player.inVehicle) {
        if(keys['ArrowUp']) player.speed = Math.min(player.speed + 0.4, player.maxSpeed);
        else if(keys['ArrowDown']) player.speed = Math.max(player.speed - 0.4, -player.maxSpeed/2);
        else player.speed *= 0.96;
        
        let turnSpeed = player.vehicleType === 'bike' ? 0.09 : player.vehicleType === 'horse' ? 0.07 : 0.06;
        if(keys['ArrowLeft']) player.angle -= turnSpeed * Math.abs(player.speed)/3;
        if(keys['ArrowRight']) player.angle += turnSpeed * Math.abs(player.speed)/3;
        
        player.vehicle.x += Math.sin(player.angle) * player.speed;
        player.vehicle.y -= Math.cos(player.angle) * player.speed;
        player.x = player.vehicle.x;
        player.y = player.vehicle.y;
        
        if(player.vehicle.x < 0) player.vehicle.x = 0;
        if(player.vehicle.x > canvas.width) player.vehicle.x = canvas.width;
        if(player.vehicle.y < 0) player.vehicle.y = 0;
        if(player.vehicle.y > canvas.height) player.vehicle.y = canvas.height;
    } else {
        let moveSpeed = 3.5;
        if(keys['ArrowUp'] && player.y > 0) player.y -= moveSpeed;
        if(keys['ArrowDown'] && player.y < canvas.height) player.y += moveSpeed;
        if(keys['ArrowLeft'] && player.x > 0) player.x -= moveSpeed;
        if(keys['ArrowRight'] && player.x < canvas.width) player.x += moveSpeed;
    }
    
    // Update bullets
    for(let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += Math.sin(b.angle) * b.speed;
        b.y -= Math.cos(b.angle) * b.speed;
        b.life--;
        if(b.life <= 0 || b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
            bullets.splice(i, 1);
        }
    }
    
    document.getElementById('money').textContent = '$' + player.money.toLocaleString();
    document.getElementById('healthBar').style.width = player.health + '%';
    document.getElementById('ammo').textContent = '🔫 Ammo: ' + player.ammo;
    document.getElementById('wanted').textContent = '★'.repeat(player.wantedLevel);
    document.getElementById('speedMeter').textContent = Math.floor(Math.abs(player.speed) * 20) + ' km/h';
}

function draw() {
    ctx.fillStyle = '#2a4d3a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Roads
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 70;
    ctx.beginPath();
    ctx.moveTo(0, canvas.height/2);
    ctx.lineTo(canvas.width, canvas.height/2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(canvas.width/2, 0);
    ctx.lineTo(canvas.width/2, canvas.height);
    ctx.stroke();
    
    // Lane lines
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.setLineDash([20, 20]);
    ctx.beginPath();
    ctx.moveTo(0, canvas.height/2);
    ctx.lineTo(canvas.width, canvas.height/2);
    ctx.stroke();
    ctx.setLineDash([]);
    
    // Buildings
    ctx.fillStyle = '#333';
    ctx.strokeStyle = '#555';
    ctx.lineWidth = 2;
    for(let b of buildings) {
        ctx.fillRect(b.x, b.y, b.w, b.h);
        ctx.strokeRect(b.x, b.y, b.w, b.h);
        ctx.fillStyle = '#ffff00';
        for(let i=0; i<3; i++){
            for(let j=0; j<4; j++){
                ctx.fillRect(b.x+15+i*30, b.y+15+j*30, 15, 20);
            }
        }
        ctx.fillStyle = '#333';
    }
    
    // Draw cars
    for(let car of cars) {
        ctx.save();
        ctx.translate(car.x, car.y);
        if(car.taken && player.inVehicle && car === player.vehicle) ctx.rotate(player.angle);
        ctx.fillStyle = car.color;
        ctx.fillRect(-car.w/2, -car.h/2, car.w, car.h);
        ctx.fillStyle = '#87CEEB';
        ctx.fillRect(-car.w/2+5, -car.h/2+12, car.w-10, 18);
        ctx.fillStyle = '#ffff00';
        ctx.beginPath();
        ctx.arc(-car.w/2+8, -car.h/2+5, 4, 0, Math.PI*2);
        ctx.arc(car.w/2-8, -car.h/2+5, 4, 0, Math.PI*2);
        ctx.fill();
        ctx.restore();
        if(!car.taken) {
            ctx.fillStyle = 'white';
            ctx.font = '11px Arial';
            ctx.fillText(car.name, car.x-35, car.y-car.h/2-5);
        }
    }
    
    // Draw bikes
    for(let bike of bikes) {
        ctx.save();
        ctx.translate(bike.x, bike.y);
        if(bike.taken && player.inVehicle && bike === player.vehicle) ctx.rotate(player.angle);
        ctx.fillStyle = bike.color;
        ctx.fillRect(-bike.w/2, -bike.h/2, bike.w, bike.h);
        ctx.fillStyle = '#111';
        ctx.beginPath();
        ctx.arc(0, -bike.h/2+10, 9, 0, Math.PI*2);
        ctx.arc(0, bike.h/2-10, 9, 0, Math.PI*2);
        ctx.fill();
        ctx.strokeStyle = '#333';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-bike.w/2, -bike.h/2+5);
        ctx.lineTo(bike.w/2, -bike.h/2+5);
        ctx.stroke();
        ctx.restore();
        if(!bike.taken) {
            ctx.fillStyle = 'white';
            ctx.font = '11px Arial';
            ctx.fillText(bike.name, bike.x-35, bike.y-bike.h/2-5);
        }
    }
    
    // Draw horses 🐴
    for(let horse of horses) {
        ctx.save();
        ctx.translate(horse.x, horse.y);
        if(horse.taken && player.inVehicle && horse === player.vehicle) ctx.rotate(player.angle);
        // Horse body
        ctx.fillStyle = horse.color;
        ctx.fillRect(-horse.w/2, -horse.h/2, horse.w, horse.h-15);
        // Horse head
        ctx.fillRect(-horse.w/2-8, -horse.h/2-10, 15, 20);
        // Legs
        ctx.fillStyle = '#654321';
        ctx.fillRect(-horse.w/2+5, horse.h/2-15, 5, 15);
        ctx.fillRect(horse.w/2-10, horse.h/2-15, 5, 15);
        ctx.restore();
        if(!horse.taken) {
            ctx.fillStyle = 'white';
            ctx.font = '11px Arial';
            ctx.fillText(horse.name, horse.x-35, horse.y-horse.h/2-5);
        }
    }
    
    // Draw bullets
    ctx.fillStyle = 'yellow';
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'orange';
    for(let b of bullets) {
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI*2);
        ctx.fill();
    }
    ctx.shadowBlur = 0;
    
    // Draw player
    if(!player.inVehicle) {
        ctx.fillStyle = '#ffaa00';
        ctx.beginPath();
        ctx.arc(player.x, player.y, 15, 0, Math.PI*2);
        ctx.fill();
        ctx.fillStyle = '#000';
        ctx.font = '20px Arial';
        ctx.fillText('🚶', player.x-10, player.y+7);
        // Gun indicator
        if(player.hasGun) {
            ctx.fillStyle = '#888';
            ctx.fillRect(player.x+10, player.y-5, 15, 5);
        }
    }
    
    // Minimap
    let mapCanvas = document.getElementById('miniMap');
    let mapCtx = mapCanvas.getContext('2d');
    mapCanvas.width = 150;
    mapCanvas.height = 150;
    mapCtx.fillStyle = '#0a0a0a';
    mapCtx.fillRect(0, 0, 150, 150);
    mapCtx.strokeStyle = '#444';
    mapCtx.lineWidth = 3;
    mapCtx.beginPath();
    mapCtx.moveTo(0, 75);
    mapCtx.lineTo(150, 75);
    mapCtx.moveTo(75, 0);
    mapCtx.lineTo(75, 150);
    mapCtx.stroke();
    mapCtx.fillStyle = '#ff0000';
    mapCtx.beginPath();
    mapCtx.arc(player.x/(canvas.width/150), player.y/(canvas.height/150), 3, 0, Math.PI*2);
    mapCtx.fill();
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
  </html>
