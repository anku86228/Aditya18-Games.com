<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>GTA V3</title><style>*{margin:0;padding:0;overflow:hidden}body{background:#87CEEB}canvas{display:block}#ui{position:absolute;top:0;left:0;width:100%;height:100%;color:#fff;font-family:Arial;font-weight:bold;pointer-events:none}#money{position:absolute;top:10px;left:10px;color:#0f0;font-size:20px;text-shadow:2px 2px #000}#speed{position:absolute;top:50px;right:10px;background:#000;padding:10px;border:2px solid #0f0;border-radius:10px}#controls{position:absolute;bottom:20px;width:100%;display:flex;justify-content:space-between;padding:0 15px;pointer-events:auto}.btn{width:65px;height:65px;background:rgba(255,255,255,.5);border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#000}</style></head><body><canvas id="c"></canvas><div id="ui"><div id="money">$2,000,000</div><div id="speed">120 KM/H</div><div id="controls"><div><div class="btn" id="L">←</div><div class="btn" id="R">→</div></div><div><div class="btn" id="U" style="background:#0f0">↑</div><div class="btn" id="D" style="background:red">↓</div><div class="btn" id="E" style="background:blue;color:#fff;font-size:11px">ENTER</div></div></div></div><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script><script type="module">import*as T from'three';const s=new T.Scene();s.background=new T.Color(0x87CEEB);const cam=new T.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);cam.position.set(0,10,20);const r=new T.WebGLRenderer({canvas:document.getElementById('c')});r.setSize(innerWidth,innerHeight);s.add(new T.AmbientLight(0xfff,1.5));const gr=new T.Mesh(new T.PlaneGeometry(500,500),new T.MeshLambertMaterial({color:0x228B22}));gr.rotation.x=-Math.PI/2;s.add(gr);for(let i=-200;i<200;i+=50){const rd=new T.Mesh(new T.PlaneGeometry(500,10),new T.MeshLambertMaterial({color:0x444}));rd.rotation.x=-Math.PI/2;rd.position.set(0,.1,i);s.add(rd);}const pl=new T.Group();pl.add(new T.Mesh(new T.SphereGeometry(1.5),new T.MeshLambertMaterial({color:0xffdbac})));pl.add(new T.Mesh(new T.SphereGeometry(.5),new T.MeshLambertMaterial({color:0x000})));pl.children[1].position.y=2;pl.position.set(0,1.5,0);s.add(pl);const V=[];for(let i=0;i<3;i++){const c=new T.Group();c.add(new T.Mesh(new T.BoxGeometry(4,2,6),new T.MeshPhongMaterial({color:0x00AAFF})));c.position.set(Math.random()*30-15,1,Math.random()*30-15);c.ud={t:0};s.add(c);V.push(c)}const cops=[];for(let i=0;i<2;i++){const p=new T.Group();p.add(new T.Mesh(new T.SphereGeometry(1.5),new T.MeshLambertMaterial({color:0x0000ff})));p.position.set(Math.random()*40-20,1.5,Math.random()*40-20);s.add(p);cops.push(p)}let sp=6,ag=0,K={},inV=0,cV=0;['L','R','U','D'].forEach(k=>{document.getElementById(k).ontouchstart=()=>K[k]=1;document.getElementById(k).ontouchend=()=>K[k]=0});document.getElementById('E').ontouchstart=()=>{if(!inV){for(let v of V){if(v.position.distanceTo(pl.position)<10&&!v.ud.t){inV=1;cV=v;v.ud.t=1;pl.visible=0;document.getElementById('E').innerText='EXIT';break}}}else{inV=0;cV.ud.t=0;pl.position.copy(cV.position);pl.position.x+=8;pl.visible=1;cV=0;document.getElementById('E').innerText='ENTER'}};function U(){const t=inV?cV:pl;if(K.U)sp=Math.min(sp+.5,24);else if(K.D)sp=Math.max(sp-.5,6);else sp=Math.max(sp*.97,6);if(K.L)ag-=.08;if(K.R)ag+=.08;t.position.x+=Math.sin(ag)*sp;t.position.z-=Math.cos(ag)*sp;t.rotation.y=ag;if(inV)pl.position.copy(t.position);cam.position.x=t.position.x;cam.position.z=t.position.z+20;cam.lookAt(t.position);cops.forEach(p=>{if(p.position.distanceTo(pl.position)<50){const d=pl.position.clone().sub(p.position).normalize();p.position.add(d.multiplyScalar(.4))}});document.getElementById('speed').innerText=Math.floor(sp*20)+' KM/H'}function A(){requestAnimationFrame(A);U();r.render(s,cam)}A()</script></body></html>
