<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>GTA City V2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;overflow:hidden;}
html,body{width:100%;height:100%;background:#000;}
#game{width:100%;height:100%;display:block;}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;font-family:Arial;}
#money{position:absolute;top:10px;left:10px;color:#00ff00;font-size:18px;font-weight:bold;text-shadow:2px 2px 2px #000;}
#wanted{position:absolute;top:10px;right:10px;color:#ff0000;font-size:22px;text-shadow:2px 2px 2px #000;}
#speed{position:absolute;top:45px;right:10px;color:#00ff00;font-size:20px;background:#000;padding:5px 12px;border-radius:8px;border:2px solid #0f0;}
#vehicle{position:absolute;top:85px;right:10px;color:#0ff;font-size:13px;background:#000;padding:5px 10px;border-radius:8px;}
#joystick{position:absolute;bottom:20px;left:15px;display:flex;gap:10px;pointer-events:auto;}
#action{position:absolute;bottom:20px;right:15px;display:flex;flex-direction:column;gap:10px;pointer-events:auto;}
.btn{width:60px;height:60px;background:rgba(255,255,255,0.4);border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;font-weight:bold;}
.btn:active{background:#fff;color:#000;}
#accel{background:rgba(0,255,0,0.6);} #brake{background:rgba(255,0,0,0.6);}
#shoot{background:rgba(255,165,0,0.6);} #enter{background:rgba(0,0,255,0.6);font-size:10px;}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
    <div id="money">$2,000,000</div><div id="wanted"></div><div id="speed">120 KM/H</div><div id="vehicle">🚶 Walking</div>
    <div id="joystick"><div class="btn" id="left">←</div><div class="btn" id="right">→</div></div>
    <div id="action"><div class="btn" id="accel">↑</div><div class="btn" id="shoot">🔫</div><div class="btn" id="brake">↓</div><div class="btn" id="enter">ENTER</div></div>
</div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87CEEB);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000);
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('game'),antialias:true});renderer.setSize(innerWidth,innerHeight);
scene.add(new THREE.AmbientLight(0xffffff,0.8));const dl=new THREE.DirectionalLight(0xffffff,1);dl.position.set(50,100,50);scene.add(dl);

// 1. SADAK SAFED RANG KI = AB DIKHEGI
const ground=new THREE.Mesh(new THREE.PlaneGeometry(2000,2000),new THREE.MeshLambertMaterial({color:0x444}));ground.rotation.x=-Math.PI/2;scene.add(ground);
for(let i=-500;i<=500;i+=100){const r1=new THREE.Mesh(new THREE.PlaneGeometry(2000,12),new THREE.MeshLambertMaterial({color:0x111}));r1.rotation.x=-Math.PI/2;r1.position.set(0,0.2,i);scene.add(r1);const r2=new THREE.Mesh(new THREE.PlaneGeometry(12,2000),new THREE.MeshLambertMaterial({color:0x111}));r2.rotation.x=-Math.PI/2;r2.position.set(i,0.2,0);scene.add(r2);const line=new THREE.Mesh(new THREE.PlaneGeometry(2000,1),new THREE.MeshBasicMaterial({color:0xFFFF00}));line.rotation.x=-Math.PI/2;line.position.set(0,0.21,i);scene.add(line);}

// 2. BUILDING 
for(let i=0;i<30;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(12,Math.random()*30+15,12),new THREE.MeshLambertMaterial({color:0x777}));b.position.set(Math.random()*400-200,b.geometry.parameters.height/2,Math.random()*400-200);scene.add(b);}

// 3. GADI BIKE GHODE PAAS ME SPAWN
function makeCar(c,s,n){const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.BoxGeometry(4,1.5,8),new THREE.MeshPhongMaterial({color:c})));g.add(new THREE.Mesh(new THREE.BoxGeometry(3,1,4),new THREE.MeshPhongMaterial({color:0x222})));g.position.set(Math.random()*60-30,1.5,Math.random()*60-30);g.userData={t:'car',s:s,n:n,taken:0};scene.add(g);return g;}
function makeBike(c,s,n){const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.CylinderGeometry(0.8,0.8,3,12),new THREE.MeshPhongMaterial({color:c})));g.position.set(Math.random()*60-30,1.2,Math.random()*60-30);g.userData={t:'bike',s:s,n:n,taken:0};scene.add(g);return g;}
function makeHorse(c,s,n){const g=new THREE.Group();g.add(new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.5,4,12),new THREE.MeshLambertMaterial({color:c})));g.position.set(Math.random()*60-30,2,Math.random()*60-30);g.userData={t:'horse',s:s,n:n,taken:0};scene.add(g);return g;}
const vehicles=[makeCar(0x00AAFF,24,'Bugatti'),makeCar(0xFFAA00,22,'Lambo'),makeBike(0x00FF00,26,'Ninja')];

// 4. LOG + POLICE 
const people=[];for(let i=0;i<10;i++){const p=new THREE.Mesh(new THREE.SphereGeometry(1),new THREE.MeshLambertMaterial({color:0xffdbac}));p.position.set(Math.random()*80-40,1,Math.random()*80-40);p.userData={isPolice:i<2};scene.add(p);people.push(p);}

// 5. PLAYER + GUN HATH ME
const player=new THREE.Group();const body=new THREE.Mesh(new THREE.SphereGeometry(1.5),new THREE.MeshLambertMaterial({color:0xffaa00}));player.add(body);
const gun=new THREE.Mesh(new THREE.BoxGeometry(0.3,0.3,1.5),new THREE.MeshBasicMaterial({color:0x333}));gun.position.set(1,0,0);gun.visible=false;player.add(gun);
player.position.set(0,1.5,0);scene.add(player);
let speed=6,angle=0,keys={},money=2000000,wanted=0,inV=0,curV=0,bullets=[];camera.position.set(0,20,30);

// CONTROLS
['left','right','accel','brake'].forEach(id=>{document.getElementById(id).ontouchstart=()=>keys['Arrow'+id.charAt(0).toUpperCase()+id.slice(1)]=1;document.getElementById(id).ontouchend=()=>keys['Arrow'+id.charAt(0).toUpperCase()+id.slice(1)]=0;});
document.getElementById('shoot').ontouchstart=shoot;document.getElementById('enter').ontouchstart=enterExit;

function enterExit(){if(!inV){for(let v of vehicles){if(v.position.distanceTo(player.position)<12&&!v.userData.taken){inV=1;curV=v;v.userData.taken=1;speed=6;document.getElementById('vehicle').textContent=(v.userData.t=='car'?'🏎️':'🏍️')+' '+v.userData.n;document.getElementById('enter').textContent='EXIT';player.visible=0;break;}}}else{inV=0;curV.userData.taken=0;player.position.copy(curV.position);player.position.x+=8;player.visible=1;curV=0;speed=6;document.getElementById('vehicle').textContent='🚶 Walking';document.getElementById('enter').textContent='ENTER';}}
function shoot(){if(!inV||wanted>=5)return;wanted++;gun.visible=1;setTimeout(()=>gun.visible=0,200);const b=new THREE.Mesh(new THREE.SphereGeometry(0.4),new THREE.MeshBasicMaterial({color:0xffff00}));b.position.copy(inV?curV.position:player.position);b.userData={vx:Math.sin(angle)*15,vz:-Math.cos(angle)*15,life:40};scene.add(b);bullets.push(b);}
function update(){
    const t=inV?curV:player;const max=inV?curV.userData.s:8;const min=6;
    if(keys.ArrowUp)speed=Math.min(speed+0.6,max);else if(keys.ArrowDown)speed=Math.max(speed-0.6,min);else speed=Math.max(speed*0.96,min);
    if(keys.ArrowLeft)angle-=0.09*speed/max;if(keys.ArrowRight)angle+=0.09*speed/max;
    t.position.x+=Math.sin(angle)*speed;t.position.z-=Math.cos(angle)*speed;t.rotation.y=angle;
    if(inV)player.position.copy(t.position);
    camera.position.x=t.position.x;camera.position.z=t.position.z+30;camera.lookAt(t.position);
    bullets.forEach((b,i)=>{b.position.x+=b.userData.vx;b.position.z+=b.userData.vz;if(--b.userData.life<0){scene.remove(b);bullets.splice(i,1);}});
    people.forEach(p=>{if(p.userData.isPolice&&wanted>0&&p.position.distanceTo(player.position)<100){const dir=player.position.clone().sub(p.position).normalize();p.position.add(dir.multiplyScalar(0.8));}});
    document.getElementById('money').textContent='$'+money.toLocaleString();document.getElementById('wanted').textContent='★'.repeat(wanted);document.getElementById('speed').textContent=Math.floor(speed*20)+' KM/H';
}
function animate(){requestAnimationFrame(animate);update();renderer.render(scene,camera);}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
  </html><!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><title>GTA V3</title><style>*{margin:0;padding:0;overflow:hidden}body{background:#87CEEB}canvas{display:block}#ui{position:absolute;top:0;left:0;width:100%;height:100%;color:#fff;font-family:Arial;font-weight:bold;pointer-events:none}#money{position:absolute;top:10px;left:10px;color:#0f0;font-size:20px;text-shadow:2px 2px #000}#speed{position:absolute;top:50px;right:10px;background:#000;padding:10px;border:2px solid #0f0;border-radius:10px}#controls{position:absolute;bottom:20px;width:100%;display:flex;justify-content:space-between;padding:0 15px;pointer-events:auto}.btn{width:65px;height:65px;background:rgba(255,255,255,.5);border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;color:#000}</style></head><body><canvas id="c"></canvas><div id="ui"><div id="money">$2,000,000</div><div id="speed">120 KM/H</div><div id="controls"><div><div class="btn" id="L">←</div><div class="btn" id="R">→</div></div><div><div class="btn" id="U" style="background:#0f0">↑</div><div class="btn" id="D" style="background:red">↓</div><div class="btn" id="E" style="background:blue;color:#fff;font-size:11px">ENTER</div></div></div></div><script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script><script type="module">import*as T from'three';const s=new T.Scene();s.background=new T.Color(0x87CEEB);const cam=new T.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);cam.position.set(0,10,20);const r=new T.WebGLRenderer({canvas:document.getElementById('c')});r.setSize(innerWidth,innerHeight);s.add(new T.AmbientLight(0xfff,1.5));const gr=new T.Mesh(new T.PlaneGeometry(500,500),new T.MeshLambertMaterial({color:0x228B22}));gr.rotation.x=-Math.PI/2;s.add(gr);for(let i=-200;i<200;i+=50){const rd=new T.Mesh(new T.PlaneGeometry(500,10),new T.MeshLambertMaterial({color:0x444}));rd.rotation.x=-Math.PI/2;rd.position.set(0,.1,i);s.add(rd);}const pl=new T.Group();pl.add(new T.Mesh(new T.SphereGeometry(1.5),new T.MeshLambertMaterial({color:0xffdbac})));pl.add(new T.Mesh(new T.SphereGeometry(.5),new T.MeshLambertMaterial({color:0x000})));pl.children[1].position.y=2;pl.position.set(0,1.5,0);s.add(pl);const V=[];for(let i=0;i<3;i++){const c=new T.Group();c.add(new T.Mesh(new T.BoxGeometry(4,2,6),new T.MeshPhongMaterial({color:0x00AAFF})));c.position.set(Math.random()*30-15,1,Math.random()*30-15);c.ud={t:0};s.add(c);V.push(c)}const cops=[];for(let i=0;i<2;i++){const p=new T.Group();p.add(new T.Mesh(new T.SphereGeometry(1.5),new T.MeshLambertMaterial({color:0x0000ff})));p.position.set(Math.random()*40-20,1.5,Math.random()*40-20);s.add(p);cops.push(p)}let sp=6,ag=0,K={},inV=0,cV=0;['L','R','U','D'].forEach(k=>{document.getElementById(k).ontouchstart=()=>K[k]=1;document.getElementById(k).ontouchend=()=>K[k]=0});document.getElementById('E').ontouchstart=()=>{if(!inV){for(let v of V){if(v.position.distanceTo(pl.position)<10&&!v.ud.t){inV=1;cV=v;v.ud.t=1;pl.visible=0;document.getElementById('E').innerText='EXIT';break}}}else{inV=0;cV.ud.t=0;pl.position.copy(cV.position);pl.position.x+=8;pl.visible=1;cV=0;document.getElementById('E').innerText='ENTER'}};function U(){const t=inV?cV:pl;if(K.U)sp=Math.min(sp+.5,24);else if(K.D)sp=Math.max(sp-.5,6);else sp=Math.max(sp*.97,6);if(K.L)ag-=.08;if(K.R)ag+=.08;t.position.x+=Math.sin(ag)*sp;t.position.z-=Math.cos(ag)*sp;t.rotation.y=ag;if(inV)pl.position.copy(t.position);cam.position.x=t.position.x;cam.position.z=t.position.z+20;cam.lookAt(t.position);cops.forEach(p=>{if(p.position.distanceTo(pl.position)<50){const d=pl.position.clone().sub(p.position).normalize();p.position.add(d.multiplyScalar(.4))}});document.getElementById('speed').innerText=Math.floor(sp*20)+' KM/H'}function A(){requestAnimationFrame(A);U();r.render(s,cam)}A()</script></body></html>
