<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Highway Legends</title>

<style>
html,body{
margin:0;
padding:0;
overflow:hidden;
background:#111;
font-family:Arial,sans-serif;
color:white;
}

#scoreBox{
position:fixed;
top:10px;
left:10px;
font-size:20px;
font-weight:bold;
z-index:10;
}

canvas{
display:block;
background:#444;
}
</style>
</head>

<body>

<div id="scoreBox">Score: 0</div>

<canvas id="game"></canvas>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let score=0;
let speed=6;

const laneWidth=canvas.width/3;
const lanes=[laneWidth*0.5,laneWidth*1.5,laneWidth*2.5];

let roadOffset=0;

const car={
lane:1,
w:50,
h:90
};

let coins=[];
let enemies=[];

function spawnCoin(){
coins.push({
lane:Math.floor(Math.random()*3),
y:-50
});
}

function spawnEnemy(){
enemies.push({
lane:Math.floor(Math.random()*3),
y:-120
});
}

setInterval(spawnCoin,1200);
setInterval(spawnEnemy,1500);

function moveLeft(){
if(car.lane>0) car.lane--;
}

function moveRight(){
if(car.lane<2) car.lane++;
}

document.addEventListener("touchstart",(e)=>{
if(e.touches[0].clientX<window.innerWidth/2){
moveLeft();
}else{
moveRight();
}
});

function drawRoad(){

ctx.fillStyle="#333";
ctx.fillRect(0,0,canvas.width,canvas.height);

roadOffset+=speed;

ctx.strokeStyle="white";
ctx.lineWidth=6;

for(let x=laneWidth;x<canvas.width;x+=laneWidth){
ctx.beginPath();

for(let y=-40+(roadOffset%60);y<canvas.height;y+=60){
ctx.moveTo(x,y);
ctx.lineTo(x,y+30);
}

ctx.stroke();
}
}

function drawCar(){

const x=lanes[car.lane]-25;
const y=canvas.height-120;

ctx.fillStyle="red";
ctx.fillRect(x,y,50,90);

ctx.fillStyle="black";
ctx.beginPath();
ctx.arc(x+10,y+15,6,0,Math.PI*2);
ctx.arc(x+40,y+15,6,0,Math.PI*2);
ctx.arc(x+10,y+75,6,0,Math.PI*2);
ctx.arc(x+40,y+75,6,0,Math.PI*2);
ctx.fill();
}

function update(){

drawRoad();

const carX=lanes[car.lane]-25;
const carY=canvas.height-120;

for(let i=coins.length-1;i>=0;i--){

coins[i].y+=speed;

const x=lanes[coins[i].lane];

ctx.fillStyle="gold";
ctx.beginPath();
ctx.arc(x,coins[i].y,12,0,Math.PI*2);
ctx.fill();

if(
Math.abs(x-carX)<40 &&
Math.abs(coins[i].y-carY)<60
){
score+=10;
document.getElementById("scoreBox").innerHTML="Score: "+score;

coins.splice(i,1);

if(score===100) speed=8;
if(score===200) speed=10;
if(score===300) speed=12;
}
}

for(let i=enemies.length-1;i>=0;i--){

enemies[i].y+=speed;

const x=lanes[enemies[i].lane]-25;

ctx.fillStyle="deepskyblue";
ctx.fillRect(x,enemies[i].y,50,90);

if(
Math.abs(x-carX)<40 &&
Math.abs(enemies[i].y-carY)<70
){
alert("Game Over! Score: "+score);
location.reload();
}
}

drawCar();

requestAnimationFrame(update);
}

update();
</script>

</body>
</html>
