<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Highway Legends Pro Max</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{overflow:hidden;background:#111;touch-action:none;}
.screen{display:none;width:100vw;height:100vh;position:relative;}
.screen.active{display:block;}
/* ===== HOME SCREEN ===== */
#homeScreen{background:linear-gradient(135deg,#1e3c72,#2a5298,#1e3c72);color:white;text-align:center;padding-top:15vh;}
#homeScreen h1{font-size:42px;margin-bottom:20px;text-shadow:3px 3px 6px #000;}
.menuBtn{width:220px;padding:16px;margin:12px auto;display:block;background:linear-gradient(orange,#ff6a00);border:none;border-radius:12px;font-size:18px;font-weight:bold;color:white;box-shadow:0 4px 8px rgba(0,0,0,0.3);}
.menuBtn:active{transform:scale(0.95);}
/* ===== GAME SCREEN ===== */
#game{background:#3a3a3a;position:relative;overflow:hidden;transition:background 2s;}
#game.night{background:#0a0a2a;}
#road{width:100%;height:100%;background:repeating-linear-gradient(0deg,#555 0px,#555 40px,#444 40px,#444 80px);position:absolute;animation:roadMove 0.3s linear infinite;}
@keyframes roadMove{from{background-position:0 0;}to{background-position:0 80px;}}
.lane{position:absolute;top:0;bottom:0;width:6px;background:repeating-linear-gradient(to bottom,white 0px,white 20px,transparent 20px,transparent 40px);}
#lane1{left:33.3%;}#lane2{left:66.6%;}

/* ===== PRO CAR DESIGN ===== */
#player{
width:55px;height:100px;position:absolute;bottom:100px;left:50%;transform:translateX(-50%);z-index:10;transition:left 0.15s ease-out;
background:linear-gradient(180deg,#ff0000 0%,#cc0000 50%,#990000 100%);
border-radius:15px 15px 8px 8px;box-shadow:0 5px 15px rgba(0,0,0,0.5);
}
#player::before{ /* Windshield */
content:'';position:absolute;top:15px;left:50%;transform:translateX(-50%);width:70%;height:25px;background:linear-gradient(180deg,#87CEEB,#4682B4);border-radius:5px;border:2px solid #333;
}
#player::after{ /* Headlights */
content:'';position:absolute;bottom:5px;left:5px;right:5px;height:8px;background:radial-gradient(circle,#ffff00 0%,#ffff00 30%,transparent 70%);border-radius:50%;
}
.wheel{position:absolute;width:12px;height:18px;background:#222;border-radius:3px;bottom:-5px;}
.wheel1{left:2px;} .wheel2{right:2px;} .wheel3{left:2px;top:20px;} .wheel4{right:2px;top:20px;}

.enemy{
width:55px;height:100px;position:absolute;z-index:5;border-radius:12px 12px 6px 6px;box-shadow:0 4px 10px rgba(0,0,0,0.4);
}
.enemy::before{
content:'';position:absolute;top:12px;left:50%;transform:translateX(-50%);width:70%;height:22px;background:rgba(135,206,235,0.6);border-radius:4px;border:1px solid #333;
}
.truck{width:55px;height:130px;background:linear-gradient(180deg,#8B4513,#654321);border-radius:8px;}
.bus{width:55px;height:150px;background:linear-gradient(180deg,#0000CD,#00008B);border-radius:8px;}
.yellow-car{background:linear-gradient(180deg,#FFD700,#FFA500);}
.blue-car{background:linear-gradient(180deg,#1E90FF,#0066CC);}
.green-car{background:linear-gradient(180deg,#32CD32,#228B22);}

.coin{width:30px;height:30px;background:radial-gradient(circle,#FFD700,#FFA500);border-radius:50%;position:absolute;z-index:5;box-shadow:0 0 10px #FFD700;animation:spin 2s linear infinite;}
@keyframes spin{100%{transform:rotateY(360deg);}}
.coin::after{content:'$';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#8B4513;font-weight:bold;font-size:16px;}

#hud{position:absolute;top:10px;left:10px;color:white;z-index:100;font-size:15px;line-height:1.6;text-shadow:2px 2px 4px #000;background:rgba(0,0,0,0.4);padding:10px;border-radius:10px;}
#fuelBar{width:160px;height:18px;background:#333;border-radius:10px;margin-top:5px;overflow:hidden;border:2px solid #fff;}
#fuelFill{width:100%;height:100%;background:linear-gradient(90deg,lime,#00ff00);transition:width 0.3s;}
#speedMeter{position:absolute;top:10px;right:80px;color:white;font-size:20px;text-shadow:2px 2px 4px #000;background:rgba(0,0,0,0.4);padding:8px 15px;border-radius:10px;}
.controls{position:absolute;bottom:20px;width:100%;display:flex;justify-content:space-between;padding:0 20px;z-index:100;}
.btn{width:75px;height:75px;background:rgba(255,255,255,0.25);backdrop-filter:blur(5px);border:2px solid rgba(255,255,255,0.5);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;color:white;user-select:none;box-shadow:0 4px 10px rgba(0,0,0,0.3);}
.btn:active{background:rgba(255,255,255,0.5);transform:scale(0.9);}
#nitroBtn{position:absolute;right:20px;bottom:120px;width:85px;height:85px;background:linear-gradient(135deg,#ff6a00,#ff0000);border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:14px;z-index:100;box-shadow:0 0 20px rgba(255,100,0,0.6);}
#pauseBtn{position:absolute;top:10px;right:10px;width:55px;height:55px;background:white;border-radius:8px;display:flex;align-items:center;justify-content:center;z-index:100;font-size:24px;box-shadow:0 2px 8px rgba(0,0,0,0.3);}
#hornBtn{position:absolute;right:20px;bottom:220px;width:65px;height:65px;background:linear-gradient(135deg,#4169E1,#0000CD);border:3px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;z-index:100;}
/* ===== GARAGE SCREEN ===== */
#garageScreen{background:#1a1a1a;color:white;padding:20px;overflow-y:auto;}
.garageTitle{text-align:center;font-size:32px;margin-bottom:20px;text-shadow:2px 2px 4px #000;}
.vehicleGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:15px;margin-bottom:30px;}
.vehicleCard{background:linear-gradient(135deg,#333,#222);padding:12px;border-radius:12px;text-align:center;border:2px solid #444;transition:transform 0.2s;}
.vehicleCard:active{transform:scale(0.95);}
.vehicleCard.locked{opacity:0.4;filter:grayscale(1);}
.carPreview{width:100%;height:90px;border-radius:8px;margin-bottom:8px;position:relative;}
.buyBtn{background:linear-gradient(135deg,#00ff00,#00cc00);border:none;padding:10px;border-radius:8px;margin-top:8px;width:100%;color:#000;font-weight:bold;}
.selectBtn{background:linear-gradient(135deg,#1E90FF,#0066CC);border:none;padding:10px;border-radius:8px;margin-top:8px;width:100%;color:white;font-weight:bold;}
.backBtn{position:absolute;top:15px;left:15px;padding:12px 24px;background:linear-gradient(135deg,#ff0000,#cc0000);border:none;border-radius:8px;color:white;font-weight:bold;z-index:10;}
/* ===== GAME OVER ===== */
#gameOver{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:linear-gradient(135deg,rgba(0,0,0,0.95),rgba(20,20,20,0.95));color:white;padding:40px;border-radius:15px;text-align:center;display:none;z-index:200;border:3px solid orange;box-shadow:0 0 30px rgba(255,165,0,0.5);}
#gameOver h2{font-size:32px;margin-bottom:15px;color:orange;}
#gameOver button{margin:10px;padding:12px 25px;font-size:16px;border:none;border-radius:8px;font-weight:bold;}
</style>
</head>
<body>

<!-- HOME SCREEN -->
<div id="homeScreen" class="screen active">
    <h1>🏁 HIGHWAY LEGENDS PRO</h1>
    <button class="menuBtn" onclick="startGame()">▶ PLAY GAME</button>
    <button class="menuBtn" onclick="showScreen('garageScreen')">🏎 GARAGE</button>
    <button class="menuBtn" onclick="showScreen('shopScreen')">🛒 SHOP</button>
    <p style="margin-top:30px;font-size:18px;">High Score: <span id="homeHighScore">0</span></p>
    <p style="font-size:18px;">Total Coins: <span id="homeCoins">0</span> 🪙</p>
</div>

<!-- GAME SCREEN -->
<div id="game" class="screen">
    <div id="road">
        <div class="lane" id="lane1"></div>
        <div class="lane" id="lane2"></div>
    </div>
    <div id="player">
        <div class="wheel wheel1"></div>
        <div class="wheel wheel2"></div>
        <div class="wheel wheel3"></div>
        <div class="wheel wheel4"></div>
    </div>
    <div id="hud">
        <div>🏆 Score: <span id="score">0</span></div>
        <div>🪙 Coins: <span id="coins">0</span></div>
        <div>📏 Distance: <span id="distance">0</span>m</div>
        <div>🎚 Level: <span id="level">1</span></div>
        <div>⛽ Fuel</div>
        <div id="fuelBar"><div id="fuelFill"></div></div>
    </div>
    <div id="speedMeter">0 km/h</div>
    <div id="pauseBtn">⏸️</div>
    <div id="hornBtn">📢</div>
    <div id="nitroBtn">NITRO</div>
    <div class="controls">
        <div class="btn" id="leftBtn">←</div>
        <div class="btn" id="rightBtn">→</div>
    </div>
    <div id="gameOver">
        <h2>💀 GAME OVER!</h2>
        <p style="font-size:20px;margin:10px 0;">Score: <span id="finalScore">0</span></p>
        <p style="font-size:18px;margin:10px 0;">Coins Earned: <span id="coinsEarned">0</span> 🪙</p>
        <button onclick="showScreen('homeScreen')" style="background:linear-gradient(135deg,orange,#ff6a00);color:white;">🏠 HOME</button>
        <button onclick="restartGame()" style="background:linear-gradient(135deg,lime,#00ff00);color:#000;">🔄 RESTART</button>
    </div>
</div>

<!-- GARAGE SCREEN -->
<div id="garageScreen" class="screen">
    <button class="backBtn" onclick="showScreen('homeScreen')">← BACK</button>
    <h2 class="garageTitle">🏎 MY GARAGE</h2>
    <h3 style="color:orange;margin:10px 0;">Luxury Cars</h3>
    <div class="vehicleGrid" id="carsGrid"></div>
    <h3 style="color:dodgerblue;margin:20px 0 10px 0;">Super Bikes</h3>
    <div class="vehicleGrid" id="bikesGrid"></div>
</div>

<!-- SHOP SCREEN -->
<div id="shopScreen" class="screen">
    <button class="backBtn" onclick="showScreen('homeScreen')">← BACK</button>
    <h2 class="garageTitle">🛒 VEHICLE SHOP</h2>
    <p style="text-align:center;font-size:20px;margin-bottom:20px;">Your Coins: <span id="shopCoins">0</span> 🪙</p>
    <div class="vehicleGrid" id="shopGrid"></div>
</div>

<script>
// ===== GAME DATA - 12 CARS + 12 BIKES =====
const VEHICLES = {
    cars: [
        {name:"Rolls-Royce",price:0,color:"linear-gradient(180deg,#000080,#000033)",unlocked:true},
        {name:"Range Rover",price:500,color:"linear-gradient(180deg,#228B22,#0d4d0d)",unlocked:false},
        {name:"Lamborghini",price:1000,color:"linear-gradient(180deg,#FFD700,#FF8C00)",unlocked:false},
        {name:"Bugatti",price:2000,color:"linear-gradient(180deg,#0000FF,#000080)",unlocked:false},
        {name:"Ferrari",price:1500,color:"linear-gradient(180deg,#FF0000,#8B0000)",unlocked:false},
        {name:"McLaren",price:2500,color:"linear-gradient(180deg,#FF8C00,#FF4500)",unlocked:false},
        {name:"Porsche",price:1800,color:"linear-gradient(180deg,#C0C0C0,#808080)",unlocked:false},
        {name:"BMW M Series",price:1200,color:"linear-gradient(180deg,#4169E1,#1E3A8A)",unlocked:false},
        {name:"Mercedes AMG",price:1600,color:"linear-gradient(180deg,#A9A9A9,#696969)",unlocked:false},
        {name:"Audi R8",price:1400,color:"linear-gradient(180deg,#FFFFFF,#D3D3D3)",unlocked:false},
        {name:"Nissan GTR",price:2200,color:"linear-gradient(180deg,#DC143C,#8B0000)",unlocked:false},
        {name:"Dodge Challenger",price:1100,color:"linear-gradient(180deg,#000000,#1a1a1a)",unlocked:false}
    ],
    bikes: [
        {name:"Kawasaki Ninja",price:0,color:"linear-gradient(180deg,#00FF00,#008000)",unlocked:true},
        {name:"Hayabusa",price:600,color:"linear-gradient(180deg,#8B0000,#4d0000)",unlocked:false},
        {name:"Ducati Panigale",price:1100,color:"linear-gradient(180deg,#FF0000,#8B0000)",unlocked:false},
        {name:"BMW S1000RR",price:1300,color:"linear-gradient(180deg,#0000FF,#000080)",unlocked:false},
        {name:"Yamaha R1",price:1000,color:"linear-gradient(180deg,#1E90FF,#0066CC)",unlocked:false},
        {name:"KTM RC 390",price:700,color:"linear-gradient(180deg,#FF8C00,#FF4500)",unlocked:false},
        {name:"Aprilia RSV4",price:1400,color:"linear-gradient(180deg,#000000,#2a2a2a)",unlocked:false},
        {name:"Honda CBR",price:900,color:"linear-gradient(180deg,#FF0000,#CC0000)",unlocked:false},
        {name:"Suzuki GSX-R",price:950,color:"linear-gradient(180deg,#0000CD,#00008B)",unlocked:false},
        {name:"Ninja H2",price:2000,color:"linear-gradient(180deg,#2F4F4F,#1a1a1a)",unlocked:false},
        {name:"Ducati V4",price:1800,color:"linear-gradient(180deg,#DC143C,#8B0000)",unlocked:false},
        {name:"MV Agusta",price:1600,color:"linear-gradient(180deg,#FFD700,#FFA500)",unlocked:false}
    ]
};

let gameData = JSON.parse(localStorage.getItem('hlpGameData')) || {
    totalCoins: 1000, highScore: 0, selectedVehicle: {type:'cars',index:0},
    unlockedVehicles: ['cars-0','bikes-0']
};

function saveGame() {
    localStorage.setItem('hlpGameData', JSON.stringify(gameData));
    updateHomeUI();
}

let player, game, scoreEl, coinsEl, distanceEl, levelEl, fuelFill, speedMeter;
let playerPos = 1, score = 0, coins = 0, distance = 0, level = 1;
let fuel = 100, gameSpeed = 5, baseSpeed = 5, gameRunning = false;
let enemies = [], gameCoins = [], paused = false, nitroActive = false;
let isDay = true, dayNightTimer = 0;
let enemyTypes = ['yellow-car','blue-car','green-car','truck','bus'];

function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
    if(screenId === 'garageScreen') loadGarage();
    if(screenId === 'shopScreen') loadShop();
    if(screenId === 'homeScreen') updateHomeUI();
}

function updateHomeUI() {
    document.getElementById('homeHighScore').textContent = gameData.highScore;
    document.getElementById('homeCoins').textContent = gameData.totalCoins;
    document.getElementById('shopCoins').textContent = gameData.totalCoins;
}

function loadGarage() {
    const carsGrid = document.getElementById('carsGrid');
    const bikesGrid = document.getElementById('bikesGrid');
    carsGrid.innerHTML = ''; bikesGrid.innerHTML = '';
    
    VEHICLES.cars.forEach((car, i) => {
        let isUnlocked = gameData.unlockedVehicles.includes(`cars-${i}`);
        let isSelected = gameData.selectedVehicle.type==='cars' && gameData.selectedVehicle.index===i;
        carsGrid.innerHTML += `
            <div class="vehicleCard ${!isUnlocked?'locked':''}">
                <div class="carPreview" style="background:${car.color}"></div>
                <p style="font-weight:bold;">${car.name}</p>
                ${isUnlocked ? 
                    `<button class="selectBtn" onclick="selectVehicle('cars',${i})">${isSelected?'✓ SELECTED':'SELECT'}</button>` :
                    `<p>🔒 ${car.price} 🪙</p>`
                }
            </div>
        `;
    });
    
    VEHICLES.bikes.forEach((bike, i) => {
        let isUnlocked = gameData.unlockedVehicles.includes(`bikes-${i}`);
        let isSelected = gameData.selectedVehicle.type==='bikes' && gameData.selectedVehicle.index===i;
        bikesGrid.innerHTML += `
            <div class="vehicleCard ${!isUnlocked?'locked':''}">
                <div class="carPreview" style="background:${bike.color}"></div>
                <p style="font-weight:bold;">${bike.name}</p>
                ${isUnlocked ? 
                    `<button class="selectBtn" onclick="selectVehicle('bikes',${i})">${isSelected?'✓ SELECTED':'SELECT'}</button>` :
                    `<p>🔒 ${bike.price} 🪙</p>`
                }
            </div>
        `;
    });
}

function loadShop() {
    const shopGrid = document.getElementById('shopGrid');
    shopGrid.innerHTML = '';
    [...VEHICLES.cars.map((v,i)=>({...v,type:'cars',idx:i})), ...VEHICLES.bikes.map((v,i)=>({...v,type:'bikes',idx:i}))].forEach(v => {
        let id = `${v.type}-${v.idx}`;
        if(gameData.unlockedVehicles.includes(id)) return;
        shopGrid.innerHTML += `
            <div class="vehicleCard">
                <div class="carPreview" style="background:${v.color}"></div>
                <p style="font-weight:bold;">${v.name}</p>
                <p style="color:gold;">${v.price} 🪙</p>
                <button class="buyBtn" onclick="buyVehicle('${v.type}',${v.idx},${v.price})">BUY NOW</button>
            </div>
        `;
    });
}

function buyVehicle(type, index, price) {
    if(gameData.totalCoins >= price) {
        gameData.totalCoins -= price;
        gameData.unlockedVehicles.push(`${type}-${index}`);
        saveGame(); loadShop();
        alert('🎉 Vehicle Unlocked!');
    } else {
        alert('❌ Not enough coins!');
    }
}

function selectVehicle(type, index) {
    gameData.selectedVehicle = {type, index};
    saveGame(); loadGarage();
}

function startGame() {
    showScreen('game');
    initGame();
}

function initGame() {
    player = document.getElementById('player');
    game = document.getElementById('game');
    scoreEl = document.getElementById('score');
    coinsEl = document.getElementById('coins');
    distanceEl = document.getElementById('distance');
    levelEl = document.getElementById('level');
    fuelFill = document.getElementById('fuelFill');
    speedMeter = document.getElementById('speedMeter');
    
    let v = VEHICLES[gameData.selectedVehicle.type][gameData.selectedVehicle.index];
    player.style.background = v.color;
    
    playerPos = 1; score = 0; coins = 0; distance = 0; level = 1;
    fuel = 100; gameSpeed = baseSpeed = 5; gameRunning = true;
    enemies = []; gameCoins = []; paused = false; nitroActive = false;
    isDay = true; dayNightTimer = 0;
    
    document.getElementById('gameOver').style.display = 'none';
    game.classList.remove('night');
    setupControls(); updateGame();
}

function setupControls() {
    document.getElementById('leftBtn').ontouchstart = (e) => {e.preventDefault(); movePlayer('left');};
    document.getElementById('rightBtn').ontouchstart = (e) => {e.preventDefault(); movePlayer('right');};
    document.getElementById('pauseBtn').onclick = togglePause;
    document.getElementById('nitroBtn').onclick = activateNitro;
    document.getElementById('hornBtn').onclick = () => console.log('Horn!');
    document.onkeydown = (e) => {
        if(e.key === 'ArrowLeft') movePlayer('left');
        if(e.key === 'ArrowRight') movePlayer('right');
        if(e.key === ' ') activateNitro();
        if(e.key === 'p' || e.key === 'P') togglePause();
    };
}

function movePlayer(dir) {
    if(!gameRunning || paused) return;
    if(dir === 'left' && playerPos > 0) playerPos--;
    if(dir === 'right' && playerPos < 2) playerPos++;
    player.style.left = (16.65 + playerPos * 33.3) + '%';
}

function togglePause() {
    paused = !paused;
    document.getElementById("pauseBtn").innerText = paused ? "▶" : "⏸";
    if(!paused) updateGame();
}

function activateNitro() {
    if(nitroActive || paused || fuel < 20 || !gameRunning) return;
    nitroActive = true; gameSpeed += 5;
    document.getElementById("nitroBtn").innerText = "BOOST!";
    setTimeout(() => {
        gameSpeed = baseSpeed + level;
        nitroActive = false;
        document.getElementById("nitroBtn").innerText = "NITRO";
    }, 3000);
}

function createEnemy() {
    if(!gameRunning || paused) return;
    let type = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
    let enemy = document.createElement('div');
    enemy.className = 'enemy ' + type;
    let lane = Math.floor(Math.random() * 3);
    enemy.style.left = (16.65 + lane * 33.3) + '%';
    enemy.style.top = '-160px';
    enemy.dataset.lane = lane;
    game.appendChild(enemy); enemies.push(enemy);
}

function createCoin() {
    if(!gameRunning || paused) return;
    let coin = document.createElement('div');
    coin.className = 'coin';
    let lane = Math.floor(Math.random() * 3);
    coin.style.left = (16.65 + lane * 33.3) + '%';
    coin.style.top = '-50px';
    coin.dataset.lane = lane;
    game.appendChild(coin); gameCoins.push(coin);
}

function checkCollision(r1, r2) {
    return !(r1.right < r2.left || r1.left > r2.right || r1.bottom < r2.top || r1.top > r2.bottom);
}

function gameOver() {
    gameRunning = false;
    gameData.totalCoins += coins;
    if(score > gameData.highScore) gameData.highScore = score;
    saveGame();
    document.getElementById("finalScore").innerText = score;
    document.getElementById("coinsEarned").innerText = coins;
    document.getElementById("gameOver").style.display = "block";
}

function restartGame() { initGame(); }

function updateDayNight() {
    dayNightTimer++;
    if(dayNightTimer > 1800) {
        isDay = !isDay;
        game.classList.toggle('night', !isDay);
        dayNightTimer = 0;
    }
}

function updateGame() {
    if(paused || !gameRunning) return;
    
    distance += gameSpeed/10;
    score += Math.floor(gameSpeed/5);
    fuel -= nitroActive ? 0.4 : 0.12;
    baseSpeed = 5 + level * 0.5;
    if(!nitroActive) gameSpeed = baseSpeed;
    
    if(fuel <= 0) { fuel = 0; gameOver(); return; }
    
    level = Math.floor(distance/500) + 1;
    updateDayNight();
    
    scoreEl.textContent = score;
    coinsEl.textContent = coins;
    distanceEl.textContent = Math.floor(distance);
    levelEl.textContent = level;
    fuelFill.style.width = fuel + '%';
    fuelFill.style.background = fuel < 30 ? 'linear-gradient(90deg,red,#ff0000)' : 'linear-gradient(90deg,lime,#00ff00)';
    speedMeter.textContent = Math.floor(gameSpeed * 20) + ' km/h';
    
    let playerRect = player.getBoundingClientRect();
    
    enemies.forEach((enemy, i) => {
        let top = parseFloat(enemy.style.top) || -160;
        enemy.style.top = (top + gameSpeed) + 'px';
        if(checkCollision(playerRect, enemy.getBoundingClientRect())) gameOver();
        if(top > window.innerHeight) { enemy.remove(); enemies.splice(i,1); }
    });
    
    gameCoins.forEach((coin, i) => {
        let top = parseFloat(coin.style.top) || -50;
        coin.style.top = (top + gameSpeed) + 'px';
        if(checkCollision(playerRect, coin.getBoundingClientRect())) {
            coins += 10; score += 50; fuel = Math.min(100, fuel + 5);
            coin.remove(); gameCoins.splice(i,1);
        }
        if(top > window.innerHeight) { coin.remove(); gameCoins.splice(i,1); }
    });
    
    if(Math.random() < 0.025 + level*0.005) createEnemy();
    if(Math.random() < 0.018) createCoin();
    
    requestAnimationFrame(updateGame);
}

updateHomeUI();
