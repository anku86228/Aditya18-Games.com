<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Bike Racer 3D</title>
<style>
*{margin:0;padding:0;overflow:hidden;box-sizing:border-box;font-family:Arial}
canvas{display:block}
#ui{position:absolute;top:0;left:0;width:100%;height:100%;color:#fff;text-shadow:2px 2px #000;pointer-events:none;z-index:10}
#score{position:absolute;top:10px;left:10px;font-size:24px;font-weight:bold}
#speed{position:absolute;top:10px;right:10px;font-size:24px;font-weight:bold;color:#0f0}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:40px;display:none}
#gas{position:absolute;bottom:20px;right:20px;width:80px;height:80px;background:rgba(0,255,0,.6);border-radius:50%;pointer-events:auto;display:flex;align-items:center;justify-content:center;font-weight:bold;font-size:18px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="score">Score: 0</div>
  <div id="speed">0 KM/H</div>
  <div id="msg">CRASH! Tap to Restart</div>
</div>
<div id="gas">GAS</div>

// 1. Setup PAKKA

bike.position.set(0,.5,0);s.add(bike);
